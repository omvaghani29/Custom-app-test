# Learn more about configuring your app at https://shopify.dev/docs/apps/tools/cli/configuration

client_id = "0e10f862d789f432972bec947e8429eb"
name = "custom test app"
application_url = "https://custom-app-test.onrender.com"
embedded = true

# App description for Shopify App Store
# Note: This is a basic description. You should also add a detailed description in your Partner Dashboard
description = "Next3PL is a comprehensive third-party logistics (3PL) integration app that seamlessly connects your Shopify store with fulfillment systems. Automate order syncing, get real-time shipment updates, manage inventory across platforms, and streamline your fulfillment workflow for faster processing and improved tracking visibility."

# Support email for customer inquiries
# This email will be used in your app listing and for support communications
support_email = "supporttt@next3pl.com"

[build]
automatically_update_urls_on_dev = true
include_config_on_deploy = true

[webhooks]
api_version = "2026-01"

  [[webhooks.subscriptions]]
  topics = [ "app/uninstalled" ]
  uri = "/webhooks/app/uninstalled"

  [[webhooks.subscriptions]]
  topics = [ "app/scopes_update" ]
  uri = "/webhooks/app/scopes_update"

[access_scopes]
# Learn more at https://shopify.dev/docs/apps/tools/cli/configuration#access_scopes
scopes = "read_assigned_fulfillment_orders,write_assigned_fulfillment_orders,read_custom_fulfillment_services,write_custom_fulfillment_services,read_customers,write_customers,read_fulfillment_constraint_rules,write_fulfillment_constraint_rules,read_fulfillments,write_fulfillments,write_inventory,read_inventory,write_inventory_shipments,read_inventory_shipments,write_inventory_transfers,read_inventory_transfers,write_locations,read_locations,read_merchant_managed_fulfillment_orders,write_merchant_managed_fulfillment_orders,write_order_edits,read_order_edits,read_orders,write_orders,read_products,write_products,read_publications,write_publications,read_shipping,write_shipping,unauthenticated_read_bundles,read_third_party_fulfillment_orders,write_third_party_fulfillment_orders"

[auth]
redirect_urls = [ "https://custom-app-test.onrender.com/api/auth" ]
